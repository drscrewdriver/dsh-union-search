<article>
  <h1>用 Turndown 把 HTML 变成 Markdown 的十个坑</h1>
  <p class="byline">作者 <a href="/author/li">李十一</a> · 2026-10-19 · 12 分钟</p>
  <p>转换器最常见的失败不是转错元素,而是<b>把正文外的东西一起搬进来</b>。这篇文章按元素级、形态级、规整级三层拆解。</p>
  <h2>元素级的经典坑</h2>
  <p>版本号 <code>1.2_3_beta</code> 不转义就变斜体;表格里的竖线不转义就断列。</p>
  <blockquote><p>好的转换器宁可持续输出噪音,也不能静默丢内容。</p></blockquote>
  <h2>代码示例</h2>
  <pre><code class="language-js">const md = turndown(html);</code></pre>
